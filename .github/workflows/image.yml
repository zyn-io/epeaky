name: image
# Every push to main: ghcr.io/zyn-io/epeaky:latest (and :sha-…), built and
# tested on both architectures. A tag vX.Y.Z also makes a release: the image
# under its version with a build-provenance attestation, and a GitHub Release
# whose install.sh names that image by digest (what the site's one-liner and
# `epeaky update` run). Actions are pinned to commits: this workflow pushes
# the image every den runs.
on:
  push:
    branches: [main]
    # Releases are plain versions: no -rc, which `epeaky update` would install.
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: read
  packages: write
jobs:
  # Each architecture on its own runner: built, tested and pushed by digest.
  image:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - id: arch
        run: echo "name=${PLATFORM#linux/}" >> "$GITHUB_OUTPUT"
        env:
          PLATFORM: ${{ matrix.platform }}
      - name: Build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: epeaky:test
          cache-from: type=gha,scope=${{ steps.arch.outputs.name }}
          cache-to: type=gha,mode=max,scope=${{ steps.arch.outputs.name }}
      # The image on its own: it starts, keeps its day keys, serves its page
      # and its door, and prints a new den's first invite.
      - name: Smoke test
        run: |
          mkdir -m 777 data
          docker run -d --name den --network host -v "$PWD/data:/var/lib/den" \
            -e SECRET_KEY_BASE="$(openssl rand -base64 48)" -e PHX_HOST=localhost epeaky:test
          for i in $(seq 1 60); do curl -fsS -o /dev/null http://127.0.0.1:4000/door/ways && break; sleep 2; done
          curl -fsS http://127.0.0.1:4000/door/ways | grep -q '"invite":true'
          test "$(curl -fsS http://127.0.0.1:4000/door/keys | python3 -c 'import json,sys; print(len(json.load(sys.stdin)["keys"]))')" -ge 31
          curl -fsS http://127.0.0.1:4000/ | grep -q '<title>Epeaky</title>'
          curl -fsSI http://127.0.0.1:4000/den/den_mls_bg.wasm | grep -qi 'application/wasm'
          docker exec den /app/bin/den rpc 'Den.Host.first_invite()' | grep -Eq 'https://localhost/#invite=[0-9a-f]{64}'
          # Erlang distribution on loopback only, with this den's own cookie.
          ! ss -ltnH | awk '{print $4}' | grep -E ':4369$' | grep -Ev '^(127\.0\.0\.1|\[::1\]):'
          ss -ltnH | awk '{print $4}' | grep -q '^127.0.0.1:4369$'
          test -s data/cookie && test "$(stat -c %a data/cookie)" = 600
          docker logs den 2>&1 | tail -20
          docker rm -f den
      # The installer, as a host runs it: Caddy in front (its own certificate
      # for a .localhost name), the page over HTTPS, the first invite printed.
      - name: Install test
        run: |
          # Piped, as `curl … | sudo bash` runs it: the script on standard input.
          cat install.sh | sudo EPEAKY_IMAGE=epeaky:test EPEAKY_NO_PULL=1 bash -s -- --domain den.localhost --yes | tee install.log
          grep -Eq 'https://den\.localhost/#invite=[0-9a-f]{64}' install.log
          for i in $(seq 1 30); do curl -ksf -o /dev/null --resolve den.localhost:443:127.0.0.1 https://den.localhost/ && break; sleep 2; done
          curl -ksf --resolve den.localhost:443:127.0.0.1 https://den.localhost/ | grep -q '<title>Epeaky</title>'
          curl -ksfI --resolve den.localhost:443:127.0.0.1 https://den.localhost/ | grep -qi "content-security-policy: default-src 'none'"
          curl -ksf --resolve den.localhost:443:127.0.0.1 https://den.localhost/door/ways | grep -q '"invite":true'
          sudo epeaky invite 2 3 | grep -Ec '#invite=[0-9a-f]{64}' | grep -qx 2
          sudo epeaky members
          sudo epeaky invites | grep -q 'open until'
          # Numbers only into a call to the den; no admin API on Caddy.
          ! sudo epeaky invite '1,7);IO.puts(1' 2>/dev/null
          ! curl -sf -o /dev/null http://127.0.0.1:2019/config/
          # Nothing of the den's listens beyond loopback (no mDNS, no Erlang).
          ! sudo ss -lntupH | grep -E '"(beam\.smp|epmd)"' | awk '{print $5}' | grep -Ev '^(127\.0\.0\.1|\[::1\]):'
          # Caddy by digest. Run again, as `epeaky update` does: the den, its
          # invites and the email given before all stay.
          grep -Eq 'image: caddy:[0-9.]+@sha256:[0-9a-f]{64}$' /opt/epeaky/compose.yml
          sudo EPEAKY_IMAGE=epeaky:test EPEAKY_NO_PULL=1 bash install.sh --email ops@example.org --yes >/dev/null
          sudo EPEAKY_IMAGE=epeaky:test EPEAKY_NO_PULL=1 bash install.sh --yes | tee rerun.log
          grep -q 'email ops@example.org' /opt/epeaky/Caddyfile
          grep -q 'Make an invite with' rerun.log
          sudo epeaky invites | grep -q 'open until'
          for i in $(seq 1 30); do curl -ksf -o /dev/null --resolve den.localhost:443:127.0.0.1 https://den.localhost/door/ways && break; sleep 2; done
          curl -ksf --resolve den.localhost:443:127.0.0.1 https://den.localhost/door/ways | grep -q '"invite":true'
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
      - id: push
        name: Push by digest
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ steps.arch.outputs.name }}
      - run: mkdir -p digests && touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digest-${{ steps.arch.outputs.name }}
          path: digests/*
          retention-days: 1

  # One tag for both architectures.
  publish:
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
      - name: Tag
        working-directory: digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)
          docker buildx imagetools inspect ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}
      - id: digest
        name: The digest both architectures share
        run: |
          d=$(docker buildx imagetools inspect "ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}" --format '{{json .Manifest}}' | jq -r .digest)
          [[ "$d" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$d" >> "$GITHUB_OUTPUT"
      # Who built it, from which commit, by which workflow: signed through
      # Sigstore and stored with the image (gh attestation verify oci://…).
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

  # A version's release: its installer, pinned to the image's digest, and that
  # installer's SHA-256.
  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: The installer, pinned
        env:
          IMAGE: ghcr.io/${{ github.repository }}@${{ needs.publish.outputs.digest }}
        run: |
          mkdir out
          sed "s|^RELEASE_IMAGE=\$|RELEASE_IMAGE=$IMAGE|" install.sh > out/install.sh
          grep -Eqx "RELEASE_IMAGE=ghcr\.io/${{ github.repository }}@sha256:[0-9a-f]{64}" out/install.sh
          bash -n out/install.sh
          (cd out && sha256sum install.sh > install.sh.sha256 && cat install.sh.sha256)
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/${{ github.repository }}@${{ needs.publish.outputs.digest }}
        run: |
          # Latest (what installs and `epeaky update` take) only if no version
          # tag is higher: a fix cut for an older version updates no den.
          top=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" --jq '.[].ref | ltrimstr("refs/tags/")' | grep -Ex 'v[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -1)
          latest=false; [ "$top" = "$GITHUB_REF_NAME" ] && latest=true
          gh release create "$GITHUB_REF_NAME" out/install.sh out/install.sh.sha256 --verify-tag --latest="$latest" --title "Epeaky $GITHUB_REF_NAME" \
            --notes "Image: \`$IMAGE\`. Install: \`curl --proto '=https' --tlsv1.2 -fsSL https://epeaky.zyn-network.com/install.sh | sudo bash\`; update a den with \`epeaky update\`. Changes: DEVLOG.md."
